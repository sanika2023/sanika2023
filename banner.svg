<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380">
  <style>
    .serif { font-family: Georgia, 'Times New Roman', serif; }
    .mono  { font-family: ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace; }
    .node  { fill: #2b3a55; }
    .glow  { fill: #e07a5f; animation: pulse 3s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .g2 { animation-delay: 1s; } .g3 { animation-delay: 2s; }
    .edge  { stroke: #2b3a55; stroke-width: 1.4; opacity: .35; }
    .flow  { stroke: #e07a5f; stroke-width: 2; fill: none; stroke-dasharray: 6 10; animation: dash 4s linear infinite; }
    @keyframes pulse { 0%,100% { opacity: .35; transform: scale(1); } 50% { opacity: 1; transform: scale(1.5); } }
    @keyframes dash { to { stroke-dashoffset: -64; } }
  </style>

  <!-- card -->
  <rect x="1" y="1" width="1198" height="378" rx="18" fill="#f4efe6" stroke="#ddd4c4" stroke-width="2"/>

  <defs><clipPath id="card"><rect x="2" y="2" width="1196" height="376" rx="17"/></clipPath></defs>
  <!-- watercolor-ish blobs: a nod to the art background -->
  <g clip-path="url(#card)">
  <circle cx="930" cy="120" r="150" fill="#e07a5f" opacity=".10"/>
  <circle cx="1040" cy="250" r="120" fill="#81b29a" opacity=".14"/>
  <circle cx="860" cy="280" r="90" fill="#f2cc8f" opacity=".25"/>
  </g>

  <!-- logo + name -->
  <circle cx="92" cy="80" r="22" fill="#2b3a55"/>
  <text x="92" y="86" text-anchor="middle" class="mono" font-size="16" font-weight="700" fill="#f4efe6">sk</text>
  <text x="126" y="87" class="serif" font-size="22" font-weight="700" fill="#2b3a55">Sanika</text>

  <!-- headline -->
  <text x="72" y="168" class="mono" font-size="16" fill="#5c6b80" letter-spacing="1">AI ENGINEERING · CS @ WAYNE STATE</text>
  <text x="70" y="240" class="serif" font-size="68" fill="#1f2a3d">Hi, I’m Sanika.</text>
  <text x="72" y="290" class="serif" font-size="22" font-style="italic" fill="#5c6b80">Artist turned engineer. I build AI systems that</text>
  <text x="72" y="320" class="serif" font-size="22" font-style="italic" fill="#5c6b80">show their sources and know when they’re wrong.</text>

  <!-- neural net drawing -->
  <g>
    <!-- edges layer 1 -> 2 -->
    <line class="edge" x1="800" y1="110" x2="930" y2="80"/>
    <line class="edge" x1="800" y1="110" x2="930" y2="190"/>
    <line class="edge" x1="800" y1="110" x2="930" y2="300"/>
    <line class="edge" x1="800" y1="190" x2="930" y2="80"/>
    <line class="edge" x1="800" y1="190" x2="930" y2="190"/>
    <line class="edge" x1="800" y1="190" x2="930" y2="300"/>
    <line class="edge" x1="800" y1="270" x2="930" y2="80"/>
    <line class="edge" x1="800" y1="270" x2="930" y2="190"/>
    <line class="edge" x1="800" y1="270" x2="930" y2="300"/>
    <!-- edges layer 2 -> 3 -->
    <line class="edge" x1="930" y1="80"  x2="1060" y2="140"/>
    <line class="edge" x1="930" y1="80"  x2="1060" y2="240"/>
    <line class="edge" x1="930" y1="190" x2="1060" y2="140"/>
    <line class="edge" x1="930" y1="190" x2="1060" y2="240"/>
    <line class="edge" x1="930" y1="300" x2="1060" y2="140"/>
    <line class="edge" x1="930" y1="300" x2="1060" y2="240"/>
    <!-- animated signal path -->
    <polyline class="flow" points="800,190 930,80 1060,240"/>

    <circle class="node" cx="800" cy="110" r="9"/>
    <circle class="node" cx="800" cy="190" r="9"/>
    <circle class="node" cx="800" cy="270" r="9"/>
    <circle class="node" cx="930" cy="80"  r="11"/>
    <circle class="node" cx="930" cy="190" r="11"/>
    <circle class="node" cx="930" cy="300" r="11"/>
    <circle class="node" cx="1060" cy="140" r="9"/>
    <circle class="node" cx="1060" cy="240" r="9"/>

    <circle class="glow"    cx="800"  cy="190" r="5"/>
    <circle class="glow g2" cx="930"  cy="80"  r="5"/>
    <circle class="glow g3" cx="1060" cy="240" r="5"/>
  </g>

  <text x="930" y="352" text-anchor="middle" class="mono" font-size="13" fill="#5c6b80" letter-spacing="2">● LEARNING · BUILDING · SHIPPING</text>
</svg>
