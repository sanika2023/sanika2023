<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
<style>
 .sans{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}
 .mono{font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace}
 .tok{opacity:0;animation:appear 9s ease-out infinite}
 @keyframes appear{0%{opacity:0;transform:translateY(6px)}6%,88%{opacity:1;transform:none}96%,100%{opacity:0}}
 .cur{animation:blink 1s steps(1) infinite}
 @keyframes blink{50%{opacity:0}}
</style>
<defs>
 <linearGradient id="ink" x1="0" x2="1">
  <stop offset="0" stop-color="#ff8fc7"/><stop offset=".5" stop-color="#d38cff"/><stop offset="1" stop-color="#9d7bff"/>
 </linearGradient>
 <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#ffffff" opacity=".06"/></pattern>
 <clipPath id="c"><rect width="1200" height="400" rx="20"/></clipPath>
</defs>
<g clip-path="url(#c)">
